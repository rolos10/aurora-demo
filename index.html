// VOICE BOOK SCREEN  ← NUEVO (reemplaza ScannerScreen)
// ═══════════════════════════════════════════════════════════════
function VoiceBookScreen({ onApiKeyMissing }) {
  // phase: idle | conversing | confirm | success
  const [phase, setPhase] = useState("idle");
  const [convo, setConvo] = useState([]); // {role:'aurora'|'user', text}
  const [collected, setCollected] = useState({ specialty: null, reason: null, datetime: null });
  const [stage, setStage] = useState("greeting"); // greeting|specialty|reason|datetime|confirming|done
  const [vState, setVState] = useState("idle"); // idle|listening|speaking|thinking
  const [confCode, setConfCode] = useState("");
  const [error, setError] = useState("");

  const recognitionRef = useRef(null);
  const voiceRef = useRef(null);
  const stoppedRef = useRef(false);
  const canvasRef = useRef(null);
  const animRef = useRef(null);
  const collectedRef = useRef(collected);
  const stageRef = useRef(stage);
  const convoRef = useRef(convo);

  useEffect(() => { collectedRef.current = collected; }, [collected]);
  useEffect(() => { stageRef.current = stage; }, [stage]);
  useEffect(() => { convoRef.current = convo; }, [convo]);

  // ─── Voice helpers ───────────────────────────────────────────
  const pickSpanishVoice = () => {
    const voices = window.speechSynthesis.getVoices();
    const prefs = [
      v => /es[-_](MX|CO|US|419|ES)/i.test(v.lang) && /female|mujer|paulina|monica|sabina|helena/i.test(v.name),
      v => /es[-_](MX|CO|US|419)/i.test(v.lang),
      v => /^es/i.test(v.lang),
    ];
    for (const p of prefs) { const f = voices.find(p); if (f) return f; }
    return voices.find(v => /^es/i.test(v.lang)) || null;
  };

  const ensureVoices = () => new Promise(resolve => {
    let v = window.speechSynthesis.getVoices();
    if (v.length) { voiceRef.current = pickSpanishVoice(); resolve(); return; }
    window.speechSynthesis.onvoiceschanged = () => { voiceRef.current = pickSpanishVoice(); resolve(); };
    setTimeout(() => { voiceRef.current = pickSpanishVoice(); resolve(); }, 1200);
  });

  const speak = (text) => new Promise(resolve => {
    if (!("speechSynthesis" in window)) { resolve(); return; }
    if (recognitionRef.current) { try { recognitionRef.current.abort(); } catch(e){} recognitionRef.current = null; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (voiceRef.current) u.voice = voiceRef.current;
    u.lang = voiceRef.current?.lang || "es-MX";
    u.rate = 1.02; u.pitch = 1.08; u.volume = 1;
    u.onstart = () => { setVState("speaking"); };
    u.onend = () => { setVState("idle"); resolve(); };
    u.onerror = () => { setVState("idle"); resolve(); };
    window.speechSynthesis.speak(u);
  });

  const listen = () => new Promise((resolve, reject) => {
    const R = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!R) { reject(new Error("no-speech-api")); return; }
    const r = new R();
    r.lang = "es-MX";
    r.continuous = false;
    r.interimResults = false;
    r.maxAlternatives = 1;
    recognitionRef.current = r;
    setVState("listening");
    let finalText = "";
    r.onresult = e => { finalText = e.results[0][0].transcript.trim(); };
    r.onerror = e => { recognitionRef.current = null; setVState("idle"); reject(new Error(e.error || "recog-error")); };
    r.onend = () => { recognitionRef.current = null; setVState("idle"); resolve(finalText); };
    try { r.start(); } catch(e){ recognitionRef.current = null; reject(e); }
  });

  // ─── Visualizer ──────────────────────────────────────────────
  useEffect(() => {
    if (phase !== "conversing") return;
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    const resize = () => {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();
    let t = 0;
    const bars = 48;
    const draw = () => {
      const rect = canvas.getBoundingClientRect();
      const W = rect.width, H = rect.height;
      ctx.clearRect(0, 0, W, H);
      const cx = W / 2, cy = H / 2;
      for (let i = 0; i < bars; i++) {
        const angle = (i / bars) * Math.PI * 2;
        const phase2 = t * 0.08 + i * 0.18;
        let amp;
        if (vState === "listening") amp = 14 + Math.abs(Math.sin(phase2)) * 18 + Math.random() * 8;
        else if (vState === "speaking") amp = 18 + Math.abs(Math.sin(phase2 * 1.4)) * 26;
        else if (vState === "thinking") amp = 12 + Math.abs(Math.sin(phase2 * 0.9)) * 14;
        else amp = 10 + Math.abs(Math.sin(phase2 * 0.6)) * 8;
        const inner = 30, outer = inner + amp;
        const x1 = cx + Math.cos(angle) * inner;
        const y1 = cy + Math.sin(angle) * inner;
        const x2 = cx + Math.cos(angle) * outer;
        const y2 = cy + Math.sin(angle) * outer;
        const grad = ctx.createLinearGradient(x1, y1, x2, y2);
        if (vState === "speaking") {
          grad.addColorStop(0, "rgba(75,191,234,0.2)");
          grad.addColorStop(1, "rgba(75,191,234,1)");
        } else if (vState === "listening") {
          grad.addColorStop(0, "rgba(91,191,138,0.2)");
          grad.addColorStop(1, "rgba(91,191,138,1)");
        } else if (vState === "thinking") {
          grad.addColorStop(0, "rgba(43,77,168,0.2)");
          grad.addColorStop(1, "rgba(43,77,168,1)");
        } else {
          grad.addColorStop(0, "rgba(154,163,178,0.2)");
          grad.addColorStop(1, "rgba(154,163,178,0.8)");
        }
        ctx.strokeStyle = grad;
        ctx.lineWidth = 2.4;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
        ctx.stroke();
      }
      // center glow
      const glow = ctx.createRadialGradient(cx, cy, 2, cx, cy, 36);
      if (vState === "speaking") { glow.addColorStop(0, "rgba(75,191,234,0.9)"); glow.addColorStop(1, "rgba(75,191,234,0)"); }
      else if (vState === "listening") { glow.addColorStop(0, "rgba(91,191,138,0.9)"); glow.addColorStop(1, "rgba(91,191,138,0)"); }
      else if (vState === "thinking") { glow.addColorStop(0, "rgba(43,77,168,0.9)"); glow.addColorStop(1, "rgba(43,77,168,0)"); }
      else { glow.addColorStop(0, "rgba(154,163,178,0.5)"); glow.addColorStop(1, "rgba(154,163,178,0)"); }
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(cx, cy, 36, 0, Math.PI * 2); ctx.fill();
      t++;
      animRef.current = requestAnimationFrame(draw);
    };
    draw();
    return () => { cancelAnimationFrame(animRef.current); };
  }, [phase, vState]);

  // ─── Cleanup on unmount ──────────────────────────────────────
  useEffect(() => {
    return () => {
      stoppedRef.current = true;
      if (recognitionRef.current) { try { recognitionRef.current.abort(); } catch(e){} }
      window.speechSynthesis?.cancel();
      cancelAnimationFrame(animRef.current);
    };
  }, []);

  // ─── Claude API ──────────────────────────────────────────────
  const askClaude = async (userInput) => {
    const apiKey = getApiKey();
    if (!apiKey) {
      onApiKeyMissing();
      return null;
    }
    const history = convoRef.current.map(t => `${t.role === "aurora" ? "AURORA" : "PACIENTE"}: ${t.text}`).join("\n");
    const currentInput = userInput !== null ? userInput : "(El paciente acaba de iniciar la llamada)";

    const prompt = `Eres Aurora, recepcionista virtual cálida y eficiente de Clínica Genezen. Agendas citas médicas en español para pacientes ya autenticados en la app.

PACIENTE ACTUAL (ya identificado): ${PATIENT.name}, ${PATIENT.id}, ${PATIENT.age} años, EPS ${PATIENT.eps}.

Tu trabajo es recolectar EN ESTE ORDEN, uno a la vez (NO pidas nombre ni teléfono, ya los conocemos):

1. ESPECIALIDAD — una de: ortopedia, cardiología, urología, dermatología, ginecología, pediatría, oftalmología, neurología, medicina general, odontología
2. MOTIVO — descripción breve de la consulta
3. FECHA Y HORA preferidas

REGLAS:
- Pregunta UNA cosa a la vez, en orden.
- Saludo inicial: "Hola ${PATIENT.name.split(' ')[0]}, soy Aurora de Clínica Genezen. ¿Para qué especialidad necesita agendar?"
- Respuestas MUY CORTAS (máximo 18 palabras). Voz en tiempo real, debe ser fluida.
- Tono cálido pero directo, español natural latinoamericano.
- Si dice algo fuera de las especialidades, lista 3-4 opciones brevemente.
- Cuando tengas los 3 datos, pasa a etapa "confirming" y repite todo en una sola oración: "Perfecto, agendo cita de [especialidad] para [fecha y hora], motivo: [motivo]. ¿Confirmamos?"
- Si confirma (sí, correcto, dale, perfecto, ok, claro), pon <f>true</f> y <e>done</e>.
- Si pide corregir, vuelve a la etapa correspondiente.

CONVERSACIÓN HASTA AHORA:
${history || "(ninguna — es el primer turno)"}

ESTADO INTERNO:
- Etapa: ${stageRef.current}
- Datos recolectados: ${JSON.stringify(collectedRef.current)}

LO QUE EL PACIENTE ACABA DE DECIR:
"${currentInput}"

Responde AHORA. Tu respuesta debe ser EXACTAMENTE este XML y nada más (sin preámbulo, sin markdown):

<r>
<t>texto breve que Aurora dice en voz alta</t>
<e>greeting|specialty|reason|datetime|confirming|done</e>
<sp>especialidad o vacío</sp>
<mo>motivo o vacío</mo>
<dt>fecha y hora o vacío</dt>
<f>true o false</f>
</r>`;

    setVState("thinking");

    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 600,
          messages: [{ role: "user", content: prompt }]
        })
      });
      const raw = await res.text();
      if (!res.ok) {
        if (res.status === 401 || res.status === 403) { onApiKeyMissing(); return null; }
        throw new Error("HTTP " + res.status);
      }
      const data = JSON.parse(raw);
      if (data.error) throw new Error(data.error.message || "API error");
      const text = (data.content || []).map(c => c.text || "").join("");
      if (!text) throw new Error("Respuesta vacía");

      const tag = (n) => { const m = text.match(new RegExp("<" + n + ">([\\s\\S]*?)</" + n + ">", "i")); return m ? m[1].trim() : ""; };
      const nonEmpty = v => (v && v !== "vacío" && v !== "vacio" && v.toLowerCase() !== "null") ? v : null;

      return {
        spoken: tag("t"),
        stage: tag("e") || stageRef.current,
        collected: {
          specialty: nonEmpty(tag("sp")) || collectedRef.current.specialty,
          reason: nonEmpty(tag("mo")) || collectedRef.current.reason,
          datetime: nonEmpty(tag("dt")) || collectedRef.current.datetime,
        },
        isFinal: tag("f").toLowerCase() === "true"
      };
    } catch (err) {
      console.error("[Aurora] Error:", err);
      setError(err.message || "Error de conexión");
      setTimeout(() => setError(""), 4000);
      return null;
    }
  };

  // ─── Conversation loop ───────────────────────────────────────
  const runConversation = async () => {
    await ensureVoices();
    if (!("SpeechRecognition" in window || "webkitSpeechRecognition" in window)) {
      setError("Su navegador no soporta reconocimiento de voz. Pruebe Chrome o Safari.");
      return;
    }
    if (!getApiKey()) { onApiKeyMissing(); return; }

    setPhase("conversing");
    setConvo([]);
    setCollected({ specialty: null, reason: null, datetime: null });
    setStage("greeting");
    stoppedRef.current = false;

    const opener = await askClaude(null);
    if (!opener || stoppedRef.current) return;
    await processTurn(opener);

    while (!stoppedRef.current && stageRef.current !== "done") {
      await new Promise(r => setTimeout(r, 400));
      if (stoppedRef.current) return;
      let userText = "";
      try {
        userText = await listen();
      } catch (e) {
        if (stoppedRef.current) return;
        if (e.message === "no-speech") { await speak("No le escuché. ¿Puede repetir?"); continue; }
        if (e.message === "not-allowed") { setError("Necesito permiso del micrófono."); return; }
        if (e.message === "aborted") return;
        await speak("Perdón, intente de nuevo.");
        continue;
      }
      if (stoppedRef.current) return;
      if (!userText) { await speak("No le escuché. ¿Puede repetir?"); continue; }
      setConvo(c => [...c, { role: "user", text: userText }]);
      const reply = await askClaude(userText);
      if (!reply || stoppedRef.current) return;
      await processTurn(reply);
    }

    if (!stoppedRef.current) {
      setPhase("confirm");
    }
  };

  const processTurn = async (reply) => {
    setStage(reply.stage);
    setCollected(c => ({ ...c, ...reply.collected }));
    setConvo(c => [...c, { role: "aurora", text: reply.spoken }]);
    await speak(reply.spoken);
    if (reply.isFinal) setStage("done");
  };

  const handleCancel = () => {
    stoppedRef.current = true;
    if (recognitionRef.current) { try { recognitionRef.current.abort(); } catch(e){} }
    window.speechSynthesis?.cancel();
    setPhase("idle");
    setConvo([]);
    setCollected({ specialty: null, reason: null, datetime: null });
    setStage("greeting");
  };

  const handleConfirmSave = () => {
    const code = "AUR-" + Math.random().toString(36).slice(2, 7).toUpperCase();
    const appt = {
      id: code,
      ...collected,
      patient: PATIENT.name,
      patient_id: PATIENT.id,
      phone: PATIENT.phone,
      created_at: new Date().toISOString(),
    };
    saveVoiceAppt(appt);
    setConfCode(code);
    setPhase("success");
    speak("Listo " + PATIENT.name.split(" ")[0] + ", su cita quedó confirmada. La esperamos.");
  };

  const handleEditByVoice = async () => {
    setPhase("conversing");
    setStage("confirming");
    stoppedRef.current = false;
    await speak("¿Qué desea corregir?");
    try {
      const t = await listen();
      if (!t) return;
      setConvo(c => [...c, { role: "user", text: t }]);
      const reply = await askClaude(t);
      if (!reply) return;
      await processTurn(reply);
      while (!stoppedRef.current && stageRef.current !== "done") {
        const tt = await listen();
        if (!tt) continue;
        setConvo(c => [...c, { role: "user", text: tt }]);
        const r2 = await askClaude(tt);
        if (!r2) return;
        await processTurn(r2);
      }
      if (!stoppedRef.current) setPhase("confirm");
    } catch (e) { setPhase("confirm"); }
  };

  const reset = () => {
    handleCancel();
    setConfCode("");
  };

  const statusLabel = { idle: "En espera", listening: "Le escucho…", speaking: "Aurora habla", thinking: "Aurora piensa…" }[vState];
  const stepLabel = { greeting: "Saludo", specialty: "Especialidad", reason: "Motivo", datetime: "Fecha y hora", confirming: "Confirmación", done: "Finalizado" }[stage] || "—";
  const ledColor = { idle: C.grayMid, listening: C.mint, speaking: C.sky, thinking: C.navy }[vState];

  // ─── IDLE ────────────────────────────────────────────────────
  if (phase === "idle") return (
    <div style={{ padding: "24px 20px 100px", background: C.grayLight, minHeight: "100%" }}>
      <div style={{ fontFamily: "'Montserrat', sans-serif", fontWeight: 900, fontSize: 26, color: C.navy, marginBottom: 4 }}>Agendamiento por voz</div>
      <div style={{ color: C.grayMid, fontSize: 16, marginBottom: 28 }}>Habla con Aurora — sin teclado, sin formularios</div>

      <div style={{ background: `linear-gradient(145deg, ${C.navyDark}, ${C.navy})`, borderRadius: 28, padding: "36px 24px 32px", marginBottom: 20, textAlign: "center", boxShadow: `0 12px 40px ${C.navy}60`, position: "relative", overflow: "hidden" }}>
        <div style={{ position: "absolute", top: -80, right: -80, width: 240, height: 240, borderRadius: "50%", background: `radial-gradient(circle, ${C.sky}40, transparent 70%)`, animation: "auroraGlow 4s ease-in-out infinite" }} />
        <div style={{ position: "absolute", bottom: -100, left: -80, width: 280, height: 280, borderRadius: "50%", background: `radial-gradient(circle, ${C.mint}30, transparent 70%)`, animation: "auroraGlow 5s ease-in-out infinite" }} />

        <div style={{ position: "relative", zIndex: 2 }}>
          <div style={{ fontSize: 11, color: C.sky, letterSpacing: 4, textTransform: "uppercase", fontWeight: 700, marginBottom: 14 }}>Recepcionista virtual</div>
          <div style={{ fontFamily: "'Montserrat', sans-serif", fontWeight: 900, fontSize: 30, color: C.white, lineHeight: 1.1, marginBottom: 10 }}>Hola, soy <span style={{ background: `linear-gradient(90deg, ${C.sky}, ${C.mint})`, WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent", fontStyle: "italic" }}>Aurora</span></div>
          <div style={{ color: "rgba(255,255,255,0.75)", fontSize: 15, marginBottom: 32, padding: "0 8px" }}>Agendo su cita médica en menos de un minuto. Solo con su voz.</div>

          <button onClick={runConversation}
            style={{ width: 110, height: 110, borderRadius: "50%", background: `linear-gradient(135deg, ${C.sky}, ${C.mint})`, color: C.white, border: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto", boxShadow: `0 0 0 8px rgba(75,191,234,0.18), 0 12px 32px rgba(75,191,234,0.4)`, animation: "fabPulse 2.5s ease-in-out infinite" }}>
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <rect x="9" y="3" width="6" height="12" rx="3" />
              <path d="M5 11a7 7 0 0 0 14 0" />
              <path d="M12 18v3" />
            </svg>
          </button>
          <div style={{ marginTop: 16, fontSize: 14, color: "rgba(255,255,255,0.8)", letterSpacing: 1 }}>Toque para empezar</div>
        </div>
      </div>

      <div style={{ background: C.skyLight, borderRadius: 18, padding: 18, marginBottom: 16, display: "flex", gap: 12, alignItems: "flex-start" }}>
        <span style={{ fontSize: 28 }}>💡</span>
        <div>
          <div style={{ fontWeight: 800, color: C.navy, fontSize: 16, marginBottom: 4 }}>¿Cómo funciona?</div>
          <div style={{ color: C.navy, fontSize: 14, lineHeight: 1.5 }}>Aurora le preguntará la especialidad, el motivo y el horario que prefiere. Hable con naturalidad.</div>
        </div>
      </div>

      <div style={{ background: C.white, borderRadius: 20, padding: 18, boxShadow: "0 4px 14px rgba(0,0,0,0.05)" }}>
        <div style={{ fontWeight: 800, color: C.navy, fontSize: 16, marginBottom: 12 }}>Especialidades disponibles</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {SPECIALTIES.map((s, i) => (
            <div key={i} style={{ display: "inline-flex", alignItems: "center", gap: 6, padding: "6px 12px", background: C.grayLight, borderRadius: 999, fontSize: 13, color: C.gray, fontWeight: 600 }}>
              <span>{s.icon}</span><span>{s.name}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );

  // ─── CONVERSING ──────────────────────────────────────────────
  if (phase === "conversing") return (
    <div style={{ padding: "20px 20px 24px", background: `linear-gradient(180deg, ${C.navyDark} 0%, ${C.navy} 100%)`, minHeight: "100%", display: "flex", flexDirection: "column", position: "relative" }}>
      <div style={{ position: "absolute", top: -100, left: -100, width: 300, height: 300, borderRadius: "50%", background: `radial-gradient(circle, ${C.sky}30, transparent 70%)`, filter: "blur(40px)" }} />
      <div style={{ position: "absolute", bottom: -100, right: -100, width: 300, height: 300, borderRadius: "50%", background: `radial-gradient(circle, ${C.mint}25, transparent 70%)`, filter: "blur(40px)" }} />

      <div style={{ position: "relative", zIndex: 2, textAlign: "center", marginBottom: 8 }}>
        <div style={{ display: "inline-flex", alignItems: "center", gap: 8, fontSize: 10, letterSpacing: 4, textTransform: "uppercase", color: "rgba(255,255,255,0.7)", fontWeight: 700 }}>
          <span style={{ width: 8, height: 8, borderRadius: "50%", background: ledColor, boxShadow: `0 0 10px ${ledColor}`, animation: vState !== "idle" ? "ledBlink 1.2s ease-in-out infinite" : "none" }} />
          <span>{statusLabel}</span>
        </div>
        <div style={{ marginTop: 6, fontFamily: "'Montserrat', sans-serif", fontWeight: 700, fontSize: 18, color: C.white, fontStyle: "italic" }}>{stepLabel}</div>
      </div>

      <div style={{ position: "relative", zIndex: 2, height: 160, display: "grid", placeItems: "center", margin: "8px 0 12px" }}>
        <canvas ref={canvasRef} style={{ width: "100%", height: "100%" }} />
      </div>

      <div style={{ position: "relative", zIndex: 2, flex: 1, overflowY: "auto", display: "flex", flexDirection: "column", gap: 10, padding: "4px 2px 12px", maxHeight: 320 }}>
        {convo.map((t, i) => (
          <div key={i}
            style={{
              alignSelf: t.role === "aurora" ? "flex-start" : "flex-end",
              maxWidth: "88%",
              padding: "10px 14px",
              borderRadius: 18,
              fontSize: 14,
              lineHeight: 1.45,
              animation: "bubbleIn 0.35s ease",
              background: t.role === "aurora"
                ? "linear-gradient(135deg, rgba(75,191,234,0.18), rgba(91,191,138,0.12))"
                : "rgba(255,255,255,0.12)",
              border: t.role === "aurora" ? `1px solid ${C.sky}40` : "1px solid rgba(255,255,255,0.15)",
              color: C.white,
              backdropFilter: "blur(6px)",
            }}>
            <div style={{ fontSize: 9, letterSpacing: 2, textTransform: "uppercase", color: "rgba(255,255,255,0.55)", marginBottom: 3, fontWeight: 700 }}>{t.role === "aurora" ? "Aurora" : "Tú"}</div>
            {t.text}
          </div>
        ))}
      </div>

      {error && (
        <div style={{ position: "relative", zIndex: 2, background: "rgba(224,82,82,0.15)", border: `1px solid ${C.red}40`, color: "#ffb8b8", padding: "10px 14px", borderRadius: 12, fontSize: 13, marginBottom: 10 }}>{error}</div>
      )}

      <div style={{ position: "relative", zIndex: 2, display: "flex", gap: 10, justifyContent: "center", paddingTop: 8 }}>
        <button onClick={handleCancel}
          style={{ padding: "12px 22px", background: "rgba(255,255,255,0.08)", color: C.white, border: "1px solid rgba(255,255,255,0.18)", borderRadius: 999, fontSize: 14, fontWeight: 700, cursor: "pointer" }}>
          Cancelar
        </button>
      </div>
    </div>
  );

  // ─── CONFIRM ─────────────────────────────────────────────────
  if (phase === "confirm") return (
    <div style={{ padding: "24px 20px 24px", background: C.grayLight, minHeight: "100%" }}>
      <div style={{ fontFamily: "'Montserrat', sans-serif", fontWeight: 900, fontSize: 26, color: C.navy, marginBottom: 6 }}>¿Confirmamos su cita?</div>
      <div style={{ color: C.grayMid, fontSize: 15, marginBottom: 20 }}>Revise los datos antes de guardar</div>

      <div style={{ background: C.white, borderRadius: 22, padding: 22, marginBottom: 18, boxShadow: "0 4px 16px rgba(0,0,0,0.06)" }}>
        {[
          ["🏥 Clínica", "Genezen — Sede Principal"],
          ["📋 Especialidad", collected.specialty || "—"],
          ["💬 Motivo", collected.reason || "—"],
          ["📅 Fecha y hora", collected.datetime || "—"],
          ["🆔 Paciente", PATIENT.name],
          ["📱 Teléfono", PATIENT.phone],
        ].map(([l, v], i, arr) => (
          <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "14px 0", borderBottom: i < arr.length - 1 ? "1px solid #EEF0F5" : "none", gap: 12 }}>
            <span style={{ color: C.grayMid, fontSize: 15, flexShrink: 0 }}>{l}</span>
            <span style={{ fontWeight: 700, color: C.navy, fontSize: 15, textAlign: "right" }}>{v}</span>
          </div>
        ))}
      </div>

      <button onClick={handleConfirmSave}
        style={{ width: "100%", padding: "20px", background: `linear-gradient(90deg, ${C.mint}, #3DAA75)`, color: C.white, border: "none", borderRadius: 18, fontSize: 19, fontWeight: 800, cursor: "pointer", boxShadow: `0 8px 24px ${C.mint}60`, marginBottom: 12, display: "flex", alignItems: "center", justifyContent: "center", gap: 10 }}>
        <span style={{ fontSize: 24 }}>✅</span> Confirmar y guardar
      </button>
      <button onClick={handleEditByVoice}
        style={{ width: "100%", padding: "18px", background: "transparent", border: `2px solid ${C.navy}`, color: C.navy, borderRadius: 16, fontSize: 16, fontWeight: 700, cursor: "pointer", marginBottom: 10 }}>
        🎙️ Corregir por voz
      </button>
      <button onClick={reset}
        style={{ width: "100%", padding: "16px", background: "transparent", border: "none", color: C.grayMid, fontSize: 15, fontWeight: 600, cursor: "pointer" }}>
        Cancelar
      </button>
    </div>
  );

  // ─── SUCCESS ─────────────────────────────────────────────────
  if (phase === "success") return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", minHeight: "80vh", padding: 32, textAlign: "center", background: C.grayLight }}>
      <div style={{ width: 90, height: 90, borderRadius: "50%", background: `linear-gradient(135deg, ${C.mint}, #3DAA75)`, display: "grid", placeItems: "center", marginBottom: 20, animation: "pop 0.5s ease", boxShadow: `0 12px 40px ${C.mint}60` }}>
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5" /></svg>
      </div>
      <div style={{ fontFamily: "'Montserrat', sans-serif", fontWeight: 900, fontSize: 28, color: C.navy, marginBottom: 8 }}>¡Cita agendada!</div>

      <div style={{ background: `linear-gradient(135deg, ${C.navyDark}, ${C.navy})`, color: C.white, borderRadius: 22, padding: 24, marginBottom: 22, width: "100%" }}>
        <div style={{ fontSize: 14, opacity: 0.8, marginBottom: 6 }}>Su cita está confirmada</div>
        <div style={{ fontWeight: 900, fontSize: 22, marginBottom: 4 }}>{collected.specialty}</div>
        <div style={{ color: C.sky, fontSize: 16 }}>{collected.datetime}</div>
        <div style={{ marginTop: 14, background: "rgba(255,255,255,0.15)", borderRadius: 14, padding: "14px 16px", fontSize: 14, textAlign: "left" }}>
          <div>📋 {collected.reason}</div>
          <div style={{ marginTop: 6 }}>📍 Clínica Genezen — Sede Principal</div>
          <div style={{ marginTop: 6 }}>🔔 Le notificaremos 24h antes</div>
        </div>
      </div>

      <div style={{ padding: "8px 16px", border: `1px dashed ${C.navy}40`, borderRadius: 10, fontFamily: "monospace", fontSize: 13, letterSpacing: 3, color: C.navy, marginBottom: 24 }}>{confCode}</div>

      <button onClick={reset} style={{ padding: "18px 36px", background: C.sky, color: C.white, border: "none", borderRadius: 16, fontSize: 17, fontWeight: 700, cursor: "pointer" }}>Nueva conversación</button>
    </div>
  );

  return null;
}

// ═══════════════════════════════════════════════════════════════
// RECORDS (simplificado, sin scannedDocs)
// ═══════════════════════════════════════════════════════════════
function RecordsScreen({ onApiKeyMissing }) {
  const [expanded, setExpanded] = useState(null);
  const [aiSummary, setAiSummary] = useState("");
  const [loadingAI, setLoadingAI] = useState(false);
  const [voiceAppts, setVoiceAppts] = useState([]);

  useEffect(() => { setVoiceAppts(loadVoiceAppts()); }, []);

  const handleAI = async () => {
    const apiKey = getApiKey();
    if (!apiKey) { onApiKeyMissing(); return; }
    setLoadingAI(true); setAiSummary("");
    const prompt = `Eres un asistente médico de Clínica Genezen. Resume en lenguaje muy sencillo (para un paciente de 67 años) el historial médico del paciente Carlos Alberto Ruiz. Datos: Última consulta: Hipertensión arterial leve con Dra. Gómez (Cardiología) el 12 Mayo 2026. Exámenes: Hemograma completo normal (3 Abril 2026). Control preventivo anual con Dr. Pardo (18 Feb 2026). Vitales: Presión 128/82, Glucosa 98 mg/dL, Peso 74kg. Sé positivo, claro, breve (máx 4 frases), y al final da una recomendación de salud simple.`;
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 600, messages: [{ role: "user", content: prompt }] })
      });
      if (!res.ok) { if (res.status === 401 || res.status === 403) onApiKeyMissing(); throw new Error("HTTP " + res.status); }
      const data = await res.json();
      setAiSummary(data.content?.find(b => b.type === "text")?.text || "No disponible.");
    } catch { setAiSummary("No disponible en este momento."); }
    setLoadingAI(false);
  };

  const allRecords = [
    ...voiceAppts.map(a => ({
      date: new Date(a.created_at).toLocaleDateString("es-CO", { day: "2-digit", month: "short", year: "numeric" }),
      type: "Cita agendada por voz",
      doctor: a.specialty ? "Especialidad: " + a.specialty : "—",
      dx: (a.reason || "—") + " • " + (a.datetime || "—") + " • Cód. " + a.id,
      tag: "🎙️ Por voz",
      voice: true,
    })),
    ...RECORDS,
  ];

  return (
    <div style={{ padding: "24px 20px 100px", background: C.grayLight, minHeight: "100%" }}>
      <div style={{ fontFamily: "'Montserrat', sans-serif", fontWeight: 900, fontSize: 26, color: C.navy, marginBottom: 4 }}>Historia Clínica</div>
      <div style={{ color: C.grayMid, fontSize: 16, marginBottom: 24 }}>{PATIENT.name} • {PATIENT.id}</div>
      <div style={{ background: `linear-gradient(135deg, ${C.navy}, ${C.navyDark})`, borderRadius: 22, padding: 22, marginBottom: 20, color: C.white }}>
        <div style={{ display: "flex", gap: 16, alignItems: "center", marginBottom: 16 }}>
          <Avatar initials={PATIENT.avatar} size={58} bg={C.sky} />
          <div>
            <div style={{ fontWeight: 800, fontSize: 20 }}>{PATIENT.name}</div>
            <div style={{ opacity: 0.8, fontSize: 15 }}>{PATIENT.age} años • {PATIENT.blood} • EPS: {PATIENT.eps}</div>
          </div>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10 }}>
          {[{ l: "Presión", v: PATIENT.vitals.bp }, { l: "Glucosa", v: "98 mg/dL" }, { l: "Peso", v: PATIENT.vitals.weight }].map((x, i) => (
            <div key={i} style={{ background: "rgba(255,255,255,0.15)", borderRadius: 12, padding: "10px 8px", textAlign: "center" }}>
              <div style={{ fontWeight: 900, fontSize: 16 }}>{x.v}</div>
              <div style={{ fontSize: 12, opacity: 0.8 }}>{x.l}</div>
            </div>
          ))}
        </div>
      </div>
      <button onClick={handleAI} disabled={loadingAI}
        style={{ width: "100%", padding: "20px", background: loadingAI ? C.grayMid : `linear-gradient(90deg, ${C.mint}, #3DAA75)`, color: C.white, border: "none", borderRadius: 18, fontSize: 18, fontWeight: 800, cursor: "pointer", boxShadow: `0 6px 20px ${C.mint}60`, marginBottom: 16, display: "flex", alignItems: "center", justifyContent: "center", gap: 10 }}>
        <span style={{ fontSize: 24 }}>🤖</span>
        {loadingAI ? "Analizando historia clínica…" : "Resumen inteligente con IA"}
      </button>
      {aiSummary && (
        <div style={{ background: C.mintLight, border: `2px solid ${C.mint}`, borderRadius: 18, padding: 20, marginBottom: 20 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}><span style={{ fontSize: 20 }}>✅</span><span style={{ fontWeight: 800, color: "#2D7A55", fontSize: 17 }}>Su resumen de salud</span></div>
          <p style={{ margin: 0, color: "#1E5E3E", fontSize: 17, lineHeight: 1.6 }}>{aiSummary}</p>
        </div>
      )}
      {voiceAppts.length > 0 && (
        <div style={{ background: C.skyLight, borderRadius: 16, padding: "12px 16px", marginBottom: 16, display: "flex", gap: 10, alignItems: "center" }}>
          <span style={{ fontSize: 22 }}>🎙️</span>
          <span style={{ color: C.navy, fontWeight: 700, fontSize: 16 }}>{voiceAppts.length} cita(s) agendada(s) por voz</span>
        </div>
      )}
      <div style={{ fontWeight: 800, fontSize: 18, color: C.navy, marginBottom: 14 }}>📁 Todos los registros</div>
      {allRecords.map((r, i) => (
        <div key={i} onClick={() => setExpanded(expanded === i ? null : i)}
          style={{ background: C.white, borderRadius: 20, padding: 20, marginBottom: 12, boxShadow: "0 4px 14px rgba(0,0,0,0.06)", cursor: "pointer", border: expanded === i ? `2px solid ${C.sky}` : r.voice ? `2px solid ${C.sky}30` : "2px solid transparent" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <div>
              <Badge color={r.voice ? C.sky : r.tag === "Laboratorio" ? C.mint : C.navy}>{r.tag}</Badge>
              <div style={{ fontWeight: 800, fontSize: 18, color: C.gray, marginTop: 8 }}>{r.type}</div>
              <div style={{ color: C.grayMid, fontSize: 15, marginTop: 2 }}>{r.doctor}</div>
            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{ color: C.grayMid, fontSize: 14 }}>{r.date}</div>
              <div style={{ fontSize: 20, marginTop: 6 }}>{expanded === i ? "▲" : "▼"}</div>
            </div>
          </div>
          {expanded === i && (
            <div style={{ marginTop: 14, padding: 16, background: C.grayLight, borderRadius: 14 }}>
              <div style={{ fontWeight: 700, color: C.navy, fontSize: 16 }}>🔍 {r.voice ? "Detalle de la cita:" : "Diagnóstico / Resultado:"}</div>
              <div style={{ color: C.gray, fontSize: 17, marginTop: 6 }}>{r.dx}</div>
              <button style={{ marginTop: 14, padding: "12px 20px", background: C.sky, color: C.white, border: "none", borderRadius: 12, fontSize: 15, fontWeight: 700, cursor: "pointer" }}>📄 Ver documento completo</button>
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

      </div>
      <button onClick={() => { setStep(1); setSpecialty(null); setDoctor(null); setTime(null); setBooked(false); }} style={{ padding: "18px 40px", background: C.sky, color: C.white, border: "none", borderRadius: 16, fontSize: 18, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>Volver al inicio</button>

                <div style={{ fontSize: 11, fontWeight: screen === item.id ? 800 : 600, color: screen === item.id ? C.navy : C.grayMid, fontFamily: "inherit" }}>{item.label}</div>
                {screen === item.id && <div style={{ position: "absolute", bottom: -2, width: 24, height: 3, background: C.navy, borderRadius: 2 }} />}
                {item.id === "notif" && notifCount > 0 && <div style={{ position: "absolute", top: 0, right: 6, background: C.red, color: C.white, borderRadius: "50%", width: 16, height: 16, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 700 }}>{notifCount}</div>}
              </button>
            ))}
          </div>
        )}

        {/* Home indicator */}
        <div style={{ background: loggedIn ? C.white : C.grayLight, padding: "6px 0 10px", display: "flex", justifyContent: "center" }}>
          <div style={{ width: 130, height: 5, background: "#C0C8D4", borderRadius: 3 }} />
        </div>

        <ApiKeyModal open={apiKeyModalOpen} onClose={() => setApiKeyModalOpen(false)} initialMessage={apiKeyMessage} />
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
  </script>
</body>
</html>
